[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logloom"
version = "1.2.1"
description = "Python bindings for Logloom logging and internationalization library"
authors = [
    {name = "Logloom Team", email = "info@logloom.example"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Internationalization",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
logloom-plugin-manager = "logloom_py.plugin.manager:main"

[project.urls]
Homepage = "https://github.com/yourusername/logloom"
Repository = "https://github.com/yourusername/logloom.git"
Issues = "https://github.com/yourusername/logloom/issues"

[tool.setuptools]
package-dir = {"" = "src/bindings/python"}

[tool.setuptools.packages.find]
where = ["src/bindings/python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["logloom", "logloom_py"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]
